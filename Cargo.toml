[package]
name = "capturable-state"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Canonical SQLite _outbox, generated capture triggers, and post-commit nudge"
authors = ["Alex Woolford"]
repository = "https://github.com/alexwoolford/capturable-state"
homepage = "https://github.com/alexwoolford/capturable-state"
documentation = "https://github.com/alexwoolford/capturable-state/blob/main/docs/design-principles.md"

[lib]
name = "capturable_state"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
